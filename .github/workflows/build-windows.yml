name: Build Windows exe

on:
  workflow_dispatch:
  # push trigger so the build runs from this feature branch —
  # workflow_dispatch only works once the file is on the default branch
  push:
    branches:
      - 'claude/**'
    # version tags (v1.0.12-eg1 etc.) build the exe AND publish a GitHub release
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build Windows executable
        run: npm run build:win

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tablo2plex-win-x64
          path: tablo2plex-win-x64.exe
          if-no-files-found: error
          retention-days: 30

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: tablo2plex-win-x64.exe
          generate_release_notes: true
